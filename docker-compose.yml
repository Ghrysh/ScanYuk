services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scanyuk-app
    container_name: scanyuk-app
    restart: unless-stopped
    working_dir: /var/www
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/var/www
    networks:
      - scanyuk-network

  web:
    image: nginx:alpine
    container_name: scanyuk-web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - scanyuk-network

  db:
    image: postgres:15-alpine
    container_name: scanyuk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - scanyuk-db-data:/var/lib/postgresql/data
    networks:
      - scanyuk-network

networks:
  scanyuk-network:
    driver: bridge

volumes:
  scanyuk-db-data:
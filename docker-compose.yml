services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scanyuk-app
    container_name: scanyuk-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - scanyuk-network

  web:
    image: nginx:alpine
    container_name: scanyuk-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - scanyuk-network

  db:
    image: postgres:15-alpine
    container_name: scanyuk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - scanyuk-network

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - scanyuk-network

networks:
  scanyuk-network:
    driver: bridge

volumes:
  db-data: